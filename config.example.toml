# -----------------------------------------------------------------------------
# Storage and Task Runtime / 存储与任务运行
# -----------------------------------------------------------------------------

endpoint = ""
material_directory = ""
enable_redis = false
redis_host = "localhost"
redis_port = 6379
redis_db = 0
redis_password = ""
max_concurrent_tasks = 5
max_queued_tasks = 100

# -----------------------------------------------------------------------------
# Cross-platform Publishing / 跨平台发布
# -----------------------------------------------------------------------------

# Upload-Post relay (paid third-party service)
upload_post_enabled = false
upload_post_api_key = ""
upload_post_username = ""
upload_post_platforms = ["tiktok", "instagram"]
upload_post_auto_upload = false
upload_post_youtube_privacy_status = "public"
upload_post_max_pending_tasks = 10

# -----------------------------------------------------------------------------
# Official-API Publishing (this fork's addition, COST_MODE=ZERO friendly)
# -----------------------------------------------------------------------------
# Publishes directly through YouTube/TikTok/Instagram's own APIs instead of
# the paid Upload-Post relay above. When true, this takes priority over the
# upload_post_* settings for every cross-post. Leave the credentials for a
# platform empty to skip it -- each platform is attempted independently.
# In GitHub Actions, prefer setting the *_CLIENT_ID / *_ACCESS_TOKEN /
# *_REFRESH_TOKEN etc. as repository Secrets exposed as environment variables
# rather than writing real values into this file. See
# PLAN_IMPLEMENTACION_GITHUB.md for how to obtain each credential.
official_publish_enabled = false
official_publish_auto_upload = false
# Available values: "youtube", "tiktok", "instagram".
official_publish_platforms = ["youtube"]

# YouTube Data API v3 (OAuth 2.0 "installed app" or "web app" client).
# No app-review gate; subject to the standard 10,000-unit/day quota
# (~6 uploads/day before requesting an increase).
youtube_client_id = ""
youtube_client_secret = ""
youtube_refresh_token = ""
official_publish_youtube_privacy_status = "public"

# TikTok Content Posting API. Every post from an unaudited app is forced
# private by TikTok regardless of tiktok_privacy_level below -- expected
# until your app passes TikTok's review.
tiktok_client_key = ""
tiktok_client_secret = ""
tiktok_refresh_token = ""
tiktok_privacy_level = "SELF_ONLY"

# Instagram Graph API. Requires a Business (not Creator) account and a
# long-lived access token with instagram_business_content_publish.
# The published video is temporarily hosted as a GitHub Release asset (see
# app/services/github_asset_host.py) so Instagram has a public URL to fetch --
# this only works if the repository is public.
instagram_business_account_id = ""
instagram_access_token = ""

